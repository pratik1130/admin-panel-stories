<section id="tab-upload" class="space-y-6 max-w-4xl mx-auto bg-[#0B0F19] text-white p-2">
    <div class="flex items-center justify-between border-b border-white/10 pb-4">
        <h2 class="text-2xl font-bold">Audiobook & Episode Management</h2>
        <button type="button" onclick="switchTab('dashboard')" class="text-white/50 hover:text-white" aria-label="Close"><i class="fa-solid fa-xmark text-xl"></i></button>
    </div>
    <form id="audiobook-form" onsubmit="publishAudiobookToFirebase(event)" class="space-y-6 bg-[#131722] border border-white/10 p-6 rounded-2xl shadow-xl">
        <div>
            <label class="block text-sm font-semibold text-white/80 mb-2">Upload Audiobook Cover Image</label>
            <div class="border-2 border-dashed border-white/20 hover:border-cyan-400/60 rounded-xl p-6 text-center bg-white/[0.02] cursor-pointer relative">
                <input type="file" accept="image/*" class="hidden" id="cover-file-input" onchange="previewCoverImage(event)">
                <label for="cover-file-input" class="cursor-pointer block" id="cover-drop-area">
                    <i class="fa-solid fa-cloud-arrow-up text-3xl text-cyan-400 mb-2"></i>
                    <div class="font-bold text-sm">Click or drag & drop image (PNG, JPG, WebP)</div>
                </label>
                <div id="cover-preview-container" class="hidden mt-4 flex flex-col items-center">
                    <img id="cover-preview-img" src="" alt="Cover Preview" class="w-32 h-40 object-cover rounded-xl border border-cyan-400 shadow-md mb-2">
                    <span class="px-3 py-1 bg-emerald-500/20 text-emerald-400 text-xs font-bold rounded-full">Image Added Successfully!</span>
                </div>
            </div>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div><label class="block text-xs font-semibold text-white/70 mb-1">Title</label><input type="text" id="audiobook-title" placeholder="e.g. Cyberpunk 2099" class="w-full bg-[#0B0F19] border border-white/20 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-cyan-400" required></div>
            <div><label class="block text-xs font-semibold text-white/70 mb-1">Author</label><input type="text" id="audiobook-author" placeholder="Author name" class="w-full bg-[#0B0F19] border border-white/20 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-cyan-400" required></div>
        </div>
        <div><label class="block text-xs font-semibold text-white/70 mb-1">Description / Synopsis</label><textarea id="audiobook-desc" rows="3" placeholder="Enter audiobook description..." class="w-full bg-[#0B0F19] border border-white/20 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-cyan-400"></textarea></div>
        <div><label class="block text-xs font-semibold text-white/70 mb-1">Language</label><select id="audiobook-lang" class="w-full bg-[#0B0F19] border border-white/20 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-cyan-400"><option value="mr">Marathi (मराठी)</option><option value="hi">Hindi (हिंदी)</option><option value="en">English</option></select></div>
        
        <div class="border-t border-white/10 pt-6 space-y-4">
            <div class="flex items-center justify-between"><h3 class="font-bold text-base"><i class="fa-solid fa-music text-cyan-400 mr-2"></i> Episodes Manager</h3><button type="button" onclick="addEpisodeBlock()" class="px-4 py-2 bg-white/5 hover:bg-white/10 text-cyan-400 font-bold text-xs rounded-xl"><i class="fa-solid fa-plus mr-1"></i> Add Episode</button></div>
            <div id="episodes-container" class="space-y-4">
                <div class="bg-[#0B0F19] border border-white/10 rounded-2xl p-4 space-y-4 episode-block">
                    <div class="flex items-center justify-between"><span class="text-sm font-bold text-cyan-300 episode-title-label">Episode 1</span><button type="button" onclick="removeEpisodeBlock(this)" class="text-red-400 text-xs"><i class="fa-solid fa-trash"></i></button></div>
                    <input type="text" placeholder="Episode Title" class="w-full bg-[#131722] border border-white/20 rounded-xl px-4 py-2.5 text-sm text-white ep-title">
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <label class="p-3 bg-emerald-950/30 border border-emerald-500/30 rounded-xl text-center cursor-pointer block"><input type="file" accept="audio/*" class="hidden ep-audio-file" onchange="markFileAdded(this, 'Audio')"><i class="fa-solid fa-upload text-emerald-400 mb-1"></i><div class="text-xs font-bold text-emerald-300 ep-audio-label">UPLOAD AUDIO</div></label>
                        <label class="p-3 bg-purple-950/30 border border-purple-500/30 rounded-xl text-center cursor-pointer block"><input type="file" accept="video/mp4" class="hidden ep-video-file" onchange="markFileAdded(this, 'Teaser')"><i class="fa-solid fa-video text-purple-400 mb-1"></i><div class="text-xs font-bold text-purple-300 ep-video-label">UPLOAD TEASER VIDEO (MP4)</div></label>
                    </div>
                </div>
            </div>
        </div>
        <div class="flex justify-end pt-4 border-t border-white/10"><button type="submit" id="publish-btn" class="px-6 py-3 bg-gradient-to-r from-cyan-600 to-blue-600 text-white font-bold rounded-xl text-sm shadow-lg flex items-center gap-2"><i class="fa-solid fa-cloud-arrow-up"></i> Upload & Sync to Firebase</button></div>
    </form>
</section>

<script>
if (typeof episodeCount === 'undefined') {
    var episodeCount = 1;
}

function previewCoverImage(event) { 
    const file = event.target.files[0]; 
    if (!file) return; 
    const reader = new FileReader(); 
    reader.onload = e => { 
        document.getElementById('cover-drop-area').classList.add('hidden'); 
        const preview = document.getElementById('cover-preview-container'); 
        document.getElementById('cover-preview-img').src = e.target.result; 
        preview.classList.remove('hidden'); 
    }; 
    reader.readAsDataURL(file); 
}

function addEpisodeBlock() { 
    episodeCount++; 
    const container = document.getElementById('episodes-container'); 
    const block = document.createElement('div'); 
    block.className = 'bg-[#0B0F19] border border-white/10 rounded-2xl p-4 space-y-4 episode-block'; 
    block.innerHTML = `<div class="flex items-center justify-between"><span class="text-sm font-bold text-cyan-300 episode-title-label">Episode ${episodeCount}</span><button type="button" onclick="removeEpisodeBlock(this)" class="text-red-400 text-xs"><i class="fa-solid fa-trash"></i></button></div><input type="text" placeholder="Episode Title" class="w-full bg-[#131722] border border-white/20 rounded-xl px-4 py-2.5 text-sm text-white ep-title"><div class="grid grid-cols-1 sm:grid-cols-2 gap-3"><label class="p-3 bg-emerald-950/30 border border-emerald-500/30 rounded-xl text-center cursor-pointer block"><input type="file" accept="audio/*" class="hidden ep-audio-file" onchange="markFileAdded(this, 'Audio')"><i class="fa-solid fa-upload text-emerald-400 mb-1"></i><div class="text-xs font-bold text-emerald-300 ep-audio-label">UPLOAD AUDIO</div></label><label class="p-3 bg-purple-950/30 border border-purple-500/30 rounded-xl text-center cursor-pointer block"><input type="file" accept="video/mp4" class="hidden ep-video-file" onchange="markFileAdded(this, 'Teaser')"><i class="fa-solid fa-video text-purple-400 mb-1"></i><div class="text-xs font-bold text-purple-300 ep-video-label">UPLOAD TEASER VIDEO (MP4)</div></label></div>`; 
    container.appendChild(block); 
}

function removeEpisodeBlock(button) { 
    button.closest('.episode-block').remove(); 
}

function markFileAdded(input, fileType) { 
    if (input.files && input.files[0]) { 
        const label = input.nextElementSibling.nextElementSibling; 
        label.innerText = `${fileType}: ${input.files[0].name.substring(0, 15)}...`; 
        label.classList.add('text-cyan-400'); 
    } 
}

async function publishAudiobookToFirebase(event) {
    event.preventDefault();

    if (typeof storage === 'undefined' || typeof db === 'undefined') {
        alert('फायरबेस कनेक्शन अजून लोड झाले नाही. कृपया पेज रिफ्रेश करा.');
        return;
    }

    const coverFile = document.getElementById('cover-file-input').files[0];
    if (!coverFile) { 
        alert('कृपया कव्हर इमेज निवडा!'); 
        return; 
    }

    const btn = document.getElementById('publish-btn');
    const originalButtonContent = btn.innerHTML;
    btn.disabled = true;

    try {
        await window.requireAdmin();
        await window.waitForDatabaseConnection();
        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Uploading Files...';

        const coverRef = storage.ref('covers/' + Date.now() + '_' + coverFile.name);
        const coverSnapshot = await coverRef.put(coverFile);
        const coverImagePath = coverSnapshot.ref.fullPath;
        const episodeBlocks = [...document.querySelectorAll('.episode-block')];
        const episodes = await Promise.all(episodeBlocks.map(async (block, index) => {
            const title = block.querySelector('.ep-title').value || `Episode ${index + 1}`;
            const audioFile = block.querySelector('.ep-audio-file').files[0];
            const videoFile = block.querySelector('.ep-video-file').files[0];
            const timestamp = Date.now();
            const audioUpload = audioFile
                ? storage.ref('episodes/' + timestamp + '_' + audioFile.name).put(audioFile).then(snapshot => snapshot.ref.fullPath)
                : Promise.resolve('');
            const videoUpload = videoFile
                ? storage.ref('teasers/' + timestamp + '_' + videoFile.name).put(videoFile).then(snapshot => snapshot.ref.fullPath)
                : Promise.resolve('');
            const [audioPath, videoPath] = await Promise.all([audioUpload, videoUpload]);
            return { title, audioPath, videoPath };
        }));

        await db.ref('audiobooks/').push({
            title: document.getElementById('audiobook-title').value,
            author: document.getElementById('audiobook-author').value,
            description: document.getElementById('audiobook-desc').value,
            language: document.getElementById('audiobook-lang').value,
            coverImagePath,
            episodes,
            createdAt: Date.now()
        });

        btn.innerHTML = '<i class="fa-solid fa-check"></i> Upload Successful!';
        alert('यशस्वी! ऑडिओबुक, कव्हर इमेज आणि एपिसोड्स यशस्वीरित्या अपलोड झाले व डेटाबेसमध्ये सेव्ह झाले.');
        event.target.reset();
        document.getElementById('cover-preview-container').classList.add('hidden');
        document.getElementById('cover-drop-area').classList.remove('hidden');
        if (typeof switchTab === 'function') {
            switchTab('dashboard');
        }
    } catch (error) {
        console.error('Audiobook upload failed:', error);
        alert('अपलोड करताना एरर आला: ' + error.message);
    } finally {
        setTimeout(() => {
            btn.innerHTML = originalButtonContent;
            btn.disabled = false;
        }, 2000);
    }
}
</script>
