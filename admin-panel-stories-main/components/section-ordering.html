<section class="space-y-6 max-w-4xl mx-auto">
    <div class="flex items-center justify-between border-b border-white/10 pb-4"><h2 class="text-2xl font-bold">Section Ordering & Feed Management</h2><button onclick="switchTab('dashboard')" class="text-white/50 hover:text-white" aria-label="Close"><i class="fa-solid fa-xmark text-xl"></i></button></div>
    <div class="bg-[#131722] border border-white/10 p-6 rounded-2xl shadow-xl space-y-4"><label class="block text-xs font-semibold text-white/70">Select Feed Category</label><select id="feed-category-select" onchange="loadSectionBooks()" class="w-full bg-[#0B0F19] border border-white/20 rounded-xl px-4 py-2.5 text-sm text-white"><option value="popular">लोकप्रिय (Popular)</option><option value="trending">ट्रेंडिंग (Trending)</option><option value="new">नवीन (New)</option><option value="horror">हॉरर (Horror)</option></select></div>
    <div id="section-order-list" class="space-y-3"></div>
</section>
<script>
function loadSectionBooks() { const container = document.getElementById('section-order-list'); if (!container) return; container.innerHTML = globalAudiobooks.length ? globalAudiobooks.map((book, index) => `<div class="bg-[#131722] border border-white/10 p-3.5 rounded-xl flex items-center justify-between"><div class="text-sm font-bold">${index + 1}. ${book.title} - <span class="text-cyan-400">${book.author}</span></div></div>`).join('') : '<div class="p-4 text-center text-white/40">कोणतीही ऑडिओबुक उपलब्ध नाही.</div>'; }
loadSectionBooks();
</script>
