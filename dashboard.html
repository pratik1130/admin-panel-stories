<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex h-screen">
    <!-- Sidebar -->
    <div class="w-64 bg-slate-800 text-white flex flex-col">
        <div class="p-6 text-2xl font-bold border-b border-slate-700" data-key="admin-panel">Admin Panel</div>
        <nav class="flex-1 mt-4">
            <a href="#" class="block py-3 px-6 hover:bg-slate-700" data-key="sidebar-dashboard">Dashboard</a>
            <a href="#" class="block py-3 px-6 hover:bg-slate-700" data-key="sidebar-add-audiobook">Add Audiobook</a>
            <a href="#" class="block py-3 px-6 hover:bg-slate-700" data-key="sidebar-users">Users</a>
        </nav>
        <div class="p-6 border-t border-slate-700 text-sm text-gray-400 cursor-pointer" data-key="sidebar-logout">Log Out</div>
    </div>
    
    <!-- Main Content -->
    <div class="flex-1 flex flex-col">
        <header class="bg-white shadow flex justify-between items-center py-4 px-8">
            <div class="text-2xl font-semibold" data-key="header-dashboard">Dashboard</div>
            <select id="language-switch" class="border rounded-md p-2 focus:outline-none">
                <option value="en">English</option>
                <option value="mr">मराठी</option>
                <option value="hi">हिन्दी</option>
            </select>
        </header>
        <div class="p-8">
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- Stats Card -->
                <div class="bg-white p-6 rounded-lg shadow">
                    <div class="text-sm text-gray-500" data-key="stat-total-audiobooks">Total Audiobooks</div>
                    <div class="text-3xl font-bold mt-2">25</div>
                </div>
                <div class="bg-white p-6 rounded-lg shadow">
                    <div class="text-sm text-gray-500" data-key="stat-total-users">Total Users</div>
                    <div class="text-3xl font-bold mt-2">150</div>
                </div>
            </div>
            <!-- Quick Actions -->
            <div class="mt-8">
                <a href="#" class="bg-blue-500 text-white py-2 px-4 rounded hover:bg-blue-600 transition duration-200" data-key="action-add-audiobook">Add New Audiobook</a>
            </div>
        </div>
    </div>

    <script>
        const translations = {
            en: {
                "admin-panel": "Admin Panel",
                "sidebar-dashboard": "Dashboard",
                "sidebar-add-audiobook": "Add Audiobook",
                "sidebar-users": "Users",
                "sidebar-logout": "Log Out",
                "header-dashboard": "Dashboard",
                "stat-total-audiobooks": "Total Audiobooks",
                "stat-total-users": "Total Users",
                "action-add-audiobook": "Add New Audiobook"
            },
            mr: {
                "admin-panel": "कादवा शिवार",
                "sidebar-dashboard": "डॅशबोर्ड",
                "sidebar-add-audiobook": "ऑडिओबुक ॲड करा",
                "sidebar-users": "युजर्स",
                "sidebar-logout": "लॉग आउट",
                "header-dashboard": "डॅशबोर्ड",
                "stat-total-audiobooks": "एकूण ऑडिओबुक्स",
                "stat-total-users": "एकूण युजर्स",
                "action-add-audiobook": "नवीन ऑडिओबुक ॲड करा"
            },
            hi: {
                "admin-panel": "एडमिन पैनल",
                "sidebar-dashboard": "डैशबोर्ड",
                "sidebar-add-audiobook": "ऑडियोबुक जोड़ें",
                "sidebar-users": "उपयोगकर्ता",
                "sidebar-logout": "लॉग आउट",
                "header-dashboard": "डैशबोर्ड",
                "stat-total-audiobooks": "कुल ऑडियोबुक्स",
                "stat-total-users": "कुल उपयोगकर्ता",
                "action-add-audiobook": "नया ऑडियोबुक जोड़ें"
            }
        };

        const languageSwitch = document.getElementById('language-switch');

        languageSwitch.addEventListener('change', (e) => {
            const lang = e.target.value;
            document.querySelectorAll('[data-key]').forEach(element => {
                const key = element.getAttribute('data-key');
                if (translations[lang][key]) {
                    element.innerText = translations[lang][key];
                }
            });
        });
    </script>
</body>
</html>
