<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">
    <div class="bg-white p-8 rounded-lg shadow-lg w-96">
        <h2 class="text-2xl font-bold mb-6 text-center">Admin Login</h2>
        <form id="login-form">
            <div class="mb-4">
                <label for="email" class="block text-sm font-medium text-gray-700">Email</label>
                <input type="email" id="email" required class="w-full px-3 py-2 border border-gray-300 rounded mt-1 focus:outline-none focus:ring-blue-500 focus:border-blue-500">
            </div>
            <div class="mb-6">
                <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
                <div class="relative mt-1">
                    <input type="password" id="password" required class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:ring-blue-500 focus:border-blue-500">
                    <button type="button" id="toggle-password" class="absolute inset-y-0 right-0 px-3 flex items-center text-sm text-gray-600 focus:outline-none">शो</button>
                </div>
            </div>
            <div id="error-message" class="mb-4 text-red-500 text-sm text-center"></div>
            <button type="submit" class="w-full bg-blue-500 text-white py-2 rounded hover:bg-blue-600 transition duration-200">Login</button>
        </form>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA4ICBmqlCSpjInjTaQt3Bhg2BLXm_lqTM",
            authDomain: "majestic-boulevard-mxctm.firebaseapp.com",
            projectId: "majestic-boulevard-mxctm",
            storageBucket: "majestic-boulevard-mxctm.firebasestorage.app",
            messagingSenderId: "280298206143",
            appId: "1:280298206143:web:5748c78e3e5444650f670a"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // Toggle Password Visibility
        const passwordInput = document.getElementById('password');
        const togglePasswordButton = document.getElementById('toggle-password');

        togglePasswordButton.addEventListener('click', () => {
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                togglePasswordButton.innerText = 'हाईड';
            } else {
                passwordInput.type = 'password';
                togglePasswordButton.innerText = 'शो';
            }
        });

        const loginForm = document.getElementById('login-form');
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = passwordInput.value;
            const errorMessage = document.getElementById('error-message');

            errorMessage.innerText = "";

            try {
                await signInWithEmailAndPassword(auth, email, password);
                alert("लॉगिन यशस्वी झाले!");
                window.location.href = 'dashboard.html';
            } catch (error) {
                errorMessage.innerText = "लॉगिन अयशस्वी: " + error.message;
            }
        });
    </script>
</body>
</html>
