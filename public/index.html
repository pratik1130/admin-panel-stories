<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
    <main class="bg-white p-8 rounded-lg shadow-lg w-96">
        <h1 class="text-2xl font-bold mb-6 text-center">Admin Login</h1>
        <form id="login-form">
            <div class="mb-4">
                <label for="email" class="block text-sm font-medium text-gray-700">Email</label>
                <input type="email" id="email" autocomplete="username" required class="w-full px-3 py-2 border border-gray-300 rounded mt-1 focus:outline-none focus:ring-blue-500 focus:border-blue-500">
            </div>
            <div class="mb-6">
                <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
                <div class="relative mt-1">
                    <input type="password" id="password" autocomplete="current-password" required class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:ring-blue-500 focus:border-blue-500">
                    <button type="button" id="toggle-password" class="absolute inset-y-0 right-0 px-3 flex items-center text-sm text-gray-600 focus:outline-none">Show</button>
                </div>
            </div>
            <div id="error-message" class="mb-4 text-red-500 text-sm text-center" role="alert"></div>
            <button id="submit-button" type="submit" class="w-full bg-blue-500 text-white py-2 rounded hover:bg-blue-600 transition duration-200">Login</button>
        </form>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA4ICBmqlCSpjInjTaQt3Bhg2BLXm_lqTM",
            authDomain: "majestic-boulevard-mxctm.firebaseapp.com",
            projectId: "majestic-boulevard-mxctm",
            storageBucket: "majestic-boulevard-mxctm.firebasestorage.app",
            messagingSenderId: "280298206143",
            appId: "1:280298206143:web:5748c78e3e5444650f670a"
        };

        const auth = getAuth(initializeApp(firebaseConfig));
        const loginForm = document.getElementById('login-form');
        const passwordInput = document.getElementById('password');
        const togglePasswordButton = document.getElementById('toggle-password');
        const errorMessage = document.getElementById('error-message');
        const submitButton = document.getElementById('submit-button');

        togglePasswordButton.addEventListener('click', () => {
            const showPassword = passwordInput.type === 'password';
            passwordInput.type = showPassword ? 'text' : 'password';
            togglePasswordButton.textContent = showPassword ? 'Hide' : 'Show';
        });

        onAuthStateChanged(auth, async user => {
            if (!user) return;
            try {
                const token = await user.getIdTokenResult();
                if (token.claims.admin === true) {
                    window.location.replace('/dashboard.html');
                    return;
                }
                await signOut(auth);
                errorMessage.textContent = 'This account does not have the Firebase admin claim.';
            } catch (error) {
                errorMessage.textContent = `Unable to verify administrator access: ${error.message}`;
            }
        });

        loginForm.addEventListener('submit', async event => {
            event.preventDefault();
            errorMessage.textContent = '';
            submitButton.disabled = true;
            submitButton.textContent = 'Signing in...';

            try {
                const credential = await signInWithEmailAndPassword(auth, document.getElementById('email').value, passwordInput.value);
                const token = await credential.user.getIdTokenResult();
                if (token.claims.admin !== true) {
                    await signOut(auth);
                    throw new Error('This account does not have the Firebase admin claim.');
                }
                window.location.replace('/dashboard.html');
            } catch (error) {
                errorMessage.textContent = `Login failed: ${error.message}`;
                submitButton.disabled = false;
                submitButton.textContent = 'Login';
            }
        });
    </script>
</body>
</html>
