<section id="tab-upload" class="space-y-6 max-w-4xl mx-auto bg-[#0B0F19] text-white p-2">
    <div class="flex items-center justify-between border-b border-white/10 pb-4">
        <h2 class="text-2xl font-bold">Audiobook & Episode Management</h2>
        <button type="button" onclick="switchTab('dashboard')" class="text-white/50 hover:text-white" aria-label="Close"><i class="fa-solid fa-xmark text-xl"></i></button>
    </div>
    <form id="audiobook-form" onsubmit="publishAudiobook(event)" class="space-y-6 bg-[#131722] border border-white/10 p-6 rounded-2xl shadow-xl">
        <div>
            <label class="block text-sm font-semibold text-white/80 mb-2">Upload Audiobook Cover Image</label>
            <div class="border-2 border-dashed border-white/20 hover:border-cyan-400/60 rounded-xl p-6 text-center bg-white/[0.02] cursor-pointer relative">
                <input type="file" accept="image/*" class="hidden" id="cover-file-input" onchange="previewCoverImage(event)">
                <label for="cover-file-input" class="cursor-pointer block" id="cover-drop-area">
                    <i class="fa-solid fa-cloud-arrow-up text-3xl text-cyan-400 mb-2"></i>
                    <div class="font-bold text-sm">Click or drag & drop image (PNG, JPG, WebP)</div>
                </label>
                <div id="cover-preview-container" class="hidden mt-4 flex flex-col items-center">
                    <img id="cover-preview-img" src="" alt="Cover Preview" class="w-32 h-40 object-cover rounded-xl border border-cyan-400 shadow-md mb-2">
                    <span class="px-3 py-1 bg-emerald-500/20 text-emerald-400 text-xs font-bold rounded-full">Image Added Successfully!</span>
                </div>
            </div>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div><label class="block text-xs font-semibold text-white/70 mb-1">Title</label><input type="text" id="audiobook-title" placeholder="e.g. Cyberpunk 2099" class="w-full bg-[#0B0F19] border border-white/20 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-cyan-400" required></div>
            <div><label class="block text-xs font-semibold text-white/70 mb-1">Author</label><input type="text" id="audiobook-author" placeholder="Author name" class="w-full bg-[#0B0F19] border border-white/20 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-cyan-400" required></div>
        </div>
        <div><label class="block text-xs font-semibold text-white/70 mb-1">Description / Synopsis</label><textarea id="audiobook-desc" rows="3" placeholder="Enter audiobook description..." class="w-full bg-[#0B0F19] border border-white/20 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-cyan-400"></textarea></div>
        <div><label class="block text-xs font-semibold text-white/70 mb-1">Language</label><select id="audiobook-lang" class="w-full bg-[#0B0F19] border border-white/20 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-cyan-400"><option value="mr">Marathi (मराठी)</option><option value="hi">Hindi (हिंदी)</option><option value="en">English</option></select></div>
        <div>
            <label class="block text-xs font-semibold text-white/70 mb-2">Categories (अ‍ॅपमध्ये ज्या टॅबमध्ये दिसायचं ते निवडा)</label>
            <div class="flex flex-wrap gap-2" id="category-checkboxes"><label class="flex items-center gap-2 bg-[#0B0F19] border border-white/10 px-4 py-2 rounded-xl cursor-pointer hover:bg-white/5"><input type="checkbox" class="cat-checkbox w-4 h-4" value="Popular" checked><span class="text-sm text-white">लोकप्रिय (Popular)</span></label><label class="flex items-center gap-2 bg-[#0B0F19] border border-white/10 px-4 py-2 rounded-xl cursor-pointer hover:bg-white/5"><input type="checkbox" class="cat-checkbox w-4 h-4" value="Trending"><span class="text-sm text-white">ट्रेंडिंग (Trending)</span></label><label class="flex items-center gap-2 bg-[#0B0F19] border border-white/10 px-4 py-2 rounded-xl cursor-pointer hover:bg-white/5"><input type="checkbox" class="cat-checkbox w-4 h-4" value="New"><span class="text-sm text-white">नवीन (New & Hot)</span></label><label class="flex items-center gap-2 bg-[#0B0F19] border border-white/10 px-4 py-2 rounded-xl cursor-pointer hover:bg-white/5"><input type="checkbox" class="cat-checkbox w-4 h-4" value="Horror"><span class="text-sm text-white">हॉरर (Horror)</span></label><label class="flex items-center gap-2 bg-[#0B0F19] border border-white/10 px-4 py-2 rounded-xl cursor-pointer hover:bg-white/5"><input type="checkbox" class="cat-checkbox w-4 h-4" value="Thriller"><span class="text-sm text-white">थ्रिलर (Thriller)</span></label><label class="flex items-center gap-2 bg-[#0B0F19] border border-white/10 px-4 py-2 rounded-xl cursor-pointer hover:bg-white/5"><input type="checkbox" class="cat-checkbox w-4 h-4" value="Suspense"><span class="text-sm text-white">सस्पेन्स (Suspense)</span></label><label class="flex items-center gap-2 bg-[#0B0F19] border border-white/10 px-4 py-2 rounded-xl cursor-pointer hover:bg-white/5"><input type="checkbox" class="cat-checkbox w-4 h-4" value="Romantic"><span class="text-sm text-white">रोमँटिक (Romantic)</span></label><label class="flex items-center gap-2 bg-[#0B0F19] border border-white/10 px-4 py-2 rounded-xl cursor-pointer hover:bg-white/5"><input type="checkbox" class="cat-checkbox w-4 h-4" value="Education"><span class="text-sm text-white">शैक्षणिक (Education)</span></label></div>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <label class="flex items-center gap-3 p-4 bg-white/5 rounded-xl border border-white/10 cursor-pointer text-sm text-white"><input type="checkbox" id="audiobook-premium" class="w-4 h-4"> VIP Premium Only</label>
            <label class="flex items-center gap-3 p-4 bg-white/5 rounded-xl border border-white/10 cursor-pointer text-sm text-white"><input type="checkbox" id="audiobook-topseries" class="w-4 h-4"> Top Series</label>
        </div>
        <div><label class="block text-xs font-semibold text-white/70 mb-1">Visibility</label><select id="audiobook-status" class="w-full bg-[#0B0F19] border border-white/20 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-cyan-400"><option value="published">Published (अ‍ॅपमध्ये सर्वांना दिसेल)</option><option value="private">Private (लपवलेलं)</option><option value="unlisted">Unlisted (यादीत नाही)</option></select></div>
        
        <div class="border-t border-white/10 pt-6 space-y-4">
            <div class="flex items-center justify-between"><h3 class="font-bold text-base"><i class="fa-solid fa-music text-cyan-400 mr-2"></i> Episodes Manager</h3><button type="button" onclick="addEpisodeBlock()" class="px-4 py-2 bg-white/5 hover:bg-white/10 text-cyan-400 font-bold text-xs rounded-xl"><i class="fa-solid fa-plus mr-1"></i> Add Episode</button></div>
            <div id="episodes-container" class="space-y-4">
                <div class="bg-[#0B0F19] border border-white/10 rounded-2xl p-4 space-y-4 episode-block">
                    <div class="flex items-center justify-between"><span class="text-sm font-bold text-cyan-300 episode-title-label">Episode 1</span><button type="button" onclick="removeEpisodeBlock(this)" class="text-red-400 text-xs"><i class="fa-solid fa-trash"></i></button></div>
                    <input type="text" placeholder="Episode Title" class="w-full bg-[#131722] border border-white/20 rounded-xl px-4 py-2.5 text-sm text-white ep-title">
                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                        <label class="p-3 bg-emerald-950/30 border border-emerald-500/30 rounded-xl text-center cursor-pointer block"><input type="file" accept="audio/*" class="hidden ep-audio-file" onchange="markFileAdded(this, 'Audio')"><i class="fa-solid fa-upload text-emerald-400 mb-1"></i><div class="text-xs font-bold text-emerald-300 ep-audio-label">UPLOAD AUDIO</div></label>
                        <label class="p-3 bg-purple-950/30 border border-purple-500/30 rounded-xl text-center cursor-pointer block"><input type="file" accept="video/mp4" class="hidden ep-video-file" onchange="markFileAdded(this, 'Teaser')"><i class="fa-solid fa-video text-purple-400 mb-1"></i><div class="text-xs font-bold text-purple-300 ep-video-label">UPLOAD TEASER VIDEO (MP4)</div></label><label class="p-3 bg-sky-950/30 border border-sky-500/30 rounded-xl text-center cursor-pointer block"><input type="file" accept="image/*" class="hidden ep-cover-file" onchange="markFileAdded(this, 'Cover')"><i class="fa-solid fa-image text-sky-400 mb-1"></i><div class="text-xs font-bold text-sky-300 ep-cover-label">EPISODE COVER (OPTIONAL)</div></label>
                    </div>
                </div>
            </div>
        </div>
        <div class="flex justify-end pt-4 border-t border-white/10"><button type="submit" id="publish-btn" class="px-6 py-3 bg-gradient-to-r from-cyan-600 to-blue-600 text-white font-bold rounded-xl text-sm shadow-lg flex items-center gap-2"><i class="fa-solid fa-cloud-arrow-up"></i> Upload & Sync to Firebase</button></div>
    </form>
</section>

<script>
// Re-initialised every time this section opens (the section is re-injected on each visit).
window.episodeCount = 1;

function previewCoverImage(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = e => {
        document.getElementById('cover-drop-area').classList.add('hidden');
        const preview = document.getElementById('cover-preview-container');
        document.getElementById('cover-preview-img').src = e.target.result;
        preview.classList.remove('hidden');
    };
    reader.readAsDataURL(file);
}

function addEpisodeBlock() {
    window.episodeCount++;
    const container = document.getElementById('episodes-container');
    const block = document.createElement('div');
    block.className = 'bg-[#0B0F19] border border-white/10 rounded-2xl p-4 space-y-4 episode-block';
    block.innerHTML = `<div class="flex items-center justify-between"><span class="text-sm font-bold text-cyan-300 episode-title-label">Episode ${window.episodeCount}</span><button type="button" onclick="removeEpisodeBlock(this)" class="text-red-400 text-xs"><i class="fa-solid fa-trash"></i></button></div><input type="text" placeholder="Episode Title" class="w-full bg-[#131722] border border-white/20 rounded-xl px-4 py-2.5 text-sm text-white ep-title"><div class="grid grid-cols-1 sm:grid-cols-3 gap-3"><label class="p-3 bg-emerald-950/30 border border-emerald-500/30 rounded-xl text-center cursor-pointer block"><input type="file" accept="audio/*" class="hidden ep-audio-file" onchange="markFileAdded(this, 'Audio')"><i class="fa-solid fa-upload text-emerald-400 mb-1"></i><div class="text-xs font-bold text-emerald-300 ep-audio-label">UPLOAD AUDIO</div></label><label class="p-3 bg-purple-950/30 border border-purple-500/30 rounded-xl text-center cursor-pointer block"><input type="file" accept="video/mp4" class="hidden ep-video-file" onchange="markFileAdded(this, 'Teaser')"><i class="fa-solid fa-video text-purple-400 mb-1"></i><div class="text-xs font-bold text-purple-300 ep-video-label">UPLOAD TEASER VIDEO (MP4)</div></label><label class="p-3 bg-sky-950/30 border border-sky-500/30 rounded-xl text-center cursor-pointer block"><input type="file" accept="image/*" class="hidden ep-cover-file" onchange="markFileAdded(this, 'Cover')"><i class="fa-solid fa-image text-sky-400 mb-1"></i><div class="text-xs font-bold text-sky-300 ep-cover-label">EPISODE COVER (OPTIONAL)</div></label></div>`;
    container.appendChild(block);
}

function removeEpisodeBlock(button) {
    button.closest('.episode-block').remove();
}

function markFileAdded(input, fileType) {
    if (input.files && input.files[0]) {
        const label = input.nextElementSibling.nextElementSibling;
        label.innerText = `${fileType}: ${input.files[0].name.substring(0, 15)}...`;
        label.classList.add('text-cyan-400');
    }
}

// Uploads one file to Firebase Storage and resolves with its public download URL
// (the app plays/shows files through these URLs).
function uploadFileToStorage(file, folder, onProgress) {
    const fb = window.fb;
    const safeName = file.name.replace(/[^\w.\-]+/g, '_');
    const path = `${folder}/${Date.now()}_${Math.random().toString(36).slice(2, 8)}_${safeName}`;
    const task = fb.uploadBytesResumable(fb.ref(fb.storage, path), file, { contentType: file.type || undefined });
    return new Promise((resolve, reject) => {
        task.on('state_changed',
            snap => onProgress && onProgress(Math.round((snap.bytesTransferred / snap.totalBytes) * 100)),
            reject,
            async () => {
                try { resolve(await fb.getDownloadURL(task.snapshot.ref)); } catch (e) { reject(e); }
            });
    });
}

async function publishAudiobook(event) {
    event.preventDefault();
    const fb = window.fb;
    if (!fb) {
        alert('फायरबेस कनेक्शन अजून लोड झाले नाही. कृपया पेज रिफ्रेश करा.');
        return;
    }

    const coverFile = document.getElementById('cover-file-input').files[0];
    if (!coverFile) { alert('कृपया कव्हर इमेज निवडा!'); return; }

    const episodes = [...document.querySelectorAll('.episode-block')].map((block, index) => ({
        number: index + 1,
        title: block.querySelector('.ep-title').value.trim() || `Episode ${index + 1}`,
        audioFile: block.querySelector('.ep-audio-file').files[0],
        videoFile: block.querySelector('.ep-video-file').files[0],
        coverFile: block.querySelector('.ep-cover-file') ? block.querySelector('.ep-cover-file').files[0] : undefined
    }));
    if (!episodes.length) { alert('किमान एक एपिसोड जोडा.'); return; }
    // Basic safety checks before spending time on uploads.
    if (!coverFile.type.startsWith('image/') || coverFile.size > 5 * 1024 * 1024) { alert('कव्हर फक्त इमेज असावी आणि ५ MB पेक्षा लहान.'); return; }
    for (const ep of episodes) {
        if (ep.audioFile && (!ep.audioFile.type.startsWith('audio/') || ep.audioFile.size > 500 * 1024 * 1024)) { alert(`Episode ${ep.number}: ऑडिओ फाइल चुकीची किंवा ५०० MB पेक्षा मोठी आहे.`); return; }
        if (ep.videoFile && (ep.videoFile.type !== 'video/mp4' || ep.videoFile.size > 200 * 1024 * 1024)) { alert(`Episode ${ep.number}: टीझर MP4 असावा आणि २०० MB पेक्षा लहान.`); return; }
        if (ep.coverFile && (!ep.coverFile.type.startsWith('image/') || ep.coverFile.size > 5 * 1024 * 1024)) { alert(`Episode ${ep.number}: एपिसोड कव्हर इमेज ५ MB पेक्षा लहान असावी.`); return; }
    }
    const missing = episodes.find(ep => !ep.audioFile);
    if (missing) { alert(`Episode ${missing.number} साठी ऑडिओ फाइल निवडा.`); return; }

    const selectedCategories = [...document.querySelectorAll('.cat-checkbox:checked')].map(c => c.value);
    if (!selectedCategories.length) { alert('किमान एक कॅटेगरी निवडा (उदा. Popular).'); return; }

    const btn = document.getElementById('publish-btn');
    const originalButtonContent = btn.innerHTML;
    btn.disabled = true;
    const setStatus = text => { btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> ' + text; };

    try {
        await window.requireAdmin();

        setStatus('Uploading cover...');
        const coverUrl = await uploadFileToStorage(coverFile, 'covers', p => setStatus(`Uploading cover... ${p}%`));

        const uploaded = [];
        for (const ep of episodes) {
            setStatus(`Episode ${ep.number}/${episodes.length}: audio...`);
            const audioUrl = await uploadFileToStorage(ep.audioFile, 'episodes', p => setStatus(`Episode ${ep.number}/${episodes.length}: audio ${p}%`));
            let teaserVideoUrl = '';
            if (ep.videoFile) {
                setStatus(`Episode ${ep.number}/${episodes.length}: teaser...`);
                teaserVideoUrl = await uploadFileToStorage(ep.videoFile, 'teasers', p => setStatus(`Episode ${ep.number}/${episodes.length}: teaser ${p}%`));
            }
            let epCoverUrl = coverUrl;
            if (ep.coverFile) {
                setStatus(`Episode ${ep.number}/${episodes.length}: cover...`);
                epCoverUrl = await uploadFileToStorage(ep.coverFile, 'covers', p => setStatus(`Episode ${ep.number}/${episodes.length}: cover ${p}%`));
            }
            uploaded.push({ ...ep, audioUrl, teaserVideoUrl, epCoverUrl });
        }

        setStatus('Saving to app database...');
        const language = document.getElementById('audiobook-lang').value;
        const bookRef = fb.doc(fb.collection(fb.db, 'audiobooks'));

        // One batch = the book becomes visible in the app only when everything is saved.
        const batch = fb.writeBatch(fb.db);
        batch.set(bookRef, {
            title: document.getElementById('audiobook-title').value.trim(),
            author: document.getElementById('audiobook-author').value.trim(),
            category: selectedCategories[0],
            categories: selectedCategories,
            synopsis: document.getElementById('audiobook-desc').value.trim(),
            isPremium: document.getElementById('audiobook-premium').checked,
            isTopSeries: document.getElementById('audiobook-topseries').checked,
            coverUrl,
            audioUrl: uploaded[0].audioUrl,
            language,
            publishingStatus: document.getElementById('audiobook-status').value,
            rank: 1,
            createdAt: fb.serverTimestamp()
        });
        for (const ep of uploaded) {
            const epRef = fb.doc(fb.collection(fb.db, 'episodes'));
            batch.set(epRef, {
                audiobookId: bookRef.id,
                title: ep.title,
                episodeNumber: ep.number,
                coverUrl: ep.epCoverUrl,
                audioUrl: ep.audioUrl,
                teaserVideoUrl: ep.teaserVideoUrl,
                createdAt: fb.serverTimestamp()
            });
            batch.set(fb.doc(fb.collection(fb.db, 'transcripts')), {
                audiobookId: bookRef.id,
                episodeId: epRef.id,
                language,
                segments: [],
                createdAt: fb.serverTimestamp()
            });
        }
        await batch.commit();

        btn.innerHTML = '<i class="fa-solid fa-check"></i> Upload Successful!';
        alert('यशस्वी! ऑडिओबुक, कव्हर इमेज आणि एपिसोड्स अपलोड होऊन अ‍ॅपच्या डेटाबेसमध्ये सेव्ह झाले.');
        if (typeof switchTab === 'function') switchTab('dashboard');
    } catch (error) {
        console.error('Audiobook upload failed:', error);
        alert('अपलोड करताना एरर आला: ' + error.message);
    } finally {
        setTimeout(() => {
            btn.innerHTML = originalButtonContent;
            btn.disabled = false;
        }, 2000);
    }
}
</script>
